# Rime schema
# encoding: utf-8
#
# 贰柒C・函流
# 支持用户调频造词的 键道27C 输入法

schema:
  schema_id: xkjd27c_flow
  name: 贰柒C・函流
  version: "1.0"
  description: |
    键道27C 的 无固定码表方案
    使用词库词频自动生成候选排序和笔码筛选权重
    支持 ` 键自主造词和 - = 键自主调频
    顶功逻辑不变
  author:
    - TsFreddie

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, 西 ]
  - name: full_shape
    states: [ 半, 全 ]
  - name: jffh
    reset: 0
    states: [ 简, 繁 ]

engine:
  processors:
    - ascii_composer
    - key_binder
    - lua_processor@*flow_shape
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - lua_filter@*flow_filter
    - simplifier@jffh
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"

translator:
  # 词库：xkjd27c_flow.ice（雾凇拼音）| xkjd27c_flow.simp（袖珍简化字）
  dictionary: xkjd27c_flow.ice
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  enable_encoder: false
  enable_charset_filter: false

# 引擎（flow_engine）需要的键位表 —— 两套方案的差异主要在这两个字母表
flow_engine:
  sound_keys: "bcdfghjklmnpqrstuwxyz;"   # 声母键
  shape_keys: "aeiov"    # 笔形键
  # 动作键（- / =）：正常模式调序，造词/声笔调整模式做对应动作
  bindings:
    promote: minus       # 调序上调 / 造词入库 / 声笔设为 sb
    demote: equal        # 降档延长 / 造词删除 / 声笔设为 sbb

# 调序与造词引擎数据库
flow_order:
  # 存储后端：leveldb（默认，高性能）| txt（纯文本，方便调试与手动修改）
  backend: leveldb
  name: xkjd27c_flow.order

# 候选提示：声码打完的候选右侧显示「让它成为首选还需要按的形码键」
# （候选按这个键数稳定排序）；声码没打完的候选不给提示——剩下的声码键
# 不保证能把候选顶到首位（同一个全码上还有词库排在前面的字）
flow_hint:
  # 笔码（形码）提示
  shape: true
  # 不可顶功提示（⛔️）
  topup: true
# 全关用 flow_hint: false（关了提示也就不排序）

# 次简（原版「二重」）：候选第 2 位标 🔹，Tab 上屏/学习；
# 设为 false 整块关掉（Tab 不处理、不显示次简候选、不学习）
flow_secondary: true

jffh:
  opencc_config: s2t.json
  option_name: jffh

punctuator:
  full_shape:
    ' ' : { commit: '　' }
    ',' : { commit: ， }
    '.' : { commit: 。 }
    ';;' : { commit: ；}   # 声母键里的标点连按两个：引擎插候选，空格上屏
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '?' : { commit: ？ }
    '/' : { commit: / }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, ＼ ]
    '|' : [ ·, ｜, '§', '¦' ]
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '%' : [ ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
  half_shape:
    ',' : { commit: ， }
    '.' : { commit: 。 }
    ';;' : { commit: ';' }  # 声母键里的标点连按两个：引擎插候选，空格上屏
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '?' : { commit: ？ }
    '/' : { commit: / }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, '\', ＼ ]
    '|' : [ ·, '|', ｜, '§', '¦' ]
    '`' : '`'
    '~' : [ '~', ～ ]
    '!' : { commit: ！ }
    '@' : '@'
    '#' : '#'
    '%' : [ '%', ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕,  ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]

key_binder:
  bindings:
    - {when: always, accept: F6, select: .next }
    - {when: always, accept: F7, toggle: jffh }
    - {when: paging, accept: bracketleft, send: Page_Up }
    - {when: has_menu, accept: bracketright, send: Page_Down }
