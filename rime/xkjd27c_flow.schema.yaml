# Rime schema
# encoding: utf-8
#
# 键道27C・流
# 支持用户调频造词的 键道27C 输入法

schema:
  schema_id: xkjd27c_flow
  name: 键道27C・流
  version: "1.0"
  description: |
    键道27C 音码方案。
    声母、韵母沿用键道27C 布局，一字两码；
    词组用键道原版简码，逐词上屏；支持形码筛选与纯笔码查表。
    码表来自键道27C 并带词频。
  author:
    - 吅吅大山（键道27C 布局）
    - 由 rime_jd27c 的码表生成

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, 西 ]
  - name: full_shape
    states: [ 半, 全 ]
  - name: jffh
    reset: 0
    states: [ 简, 繁 ]

engine:
  processors:
    - ascii_composer
    - key_binder
    - lua_processor@*flow_shape
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - lua_filter@*flow_filter
    - simplifier@jffh
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"

translator:
  # 词库变体：.ice（rime-ice，默认）| .simp（pinyin_simp）
  # 切到 simp：xkjd27c_flow.custom.yaml 里 patch 本项
  dictionary: xkjd27c_flow.ice
  enable_user_dict: false
  # 纯词表匹配（逐词）：不做整句 DP、不做前缀补全；
  # 码表连写（wumk / yfq; 等），直接按整串匹配。
  enable_sentence: false
  enable_completion: false
  enable_encoder: false
  enable_charset_filter: false

# 手动调序存储后端：leveldb（默认）| txt（纯文本，方便手改/调试）
# 用户可在 xkjd27c_flow.custom.yaml 里 patch：flow_order/backend: txt
flow_order:
  backend: leveldb
  # 两个词库变体共用一份调序数据（切词库不丢 pin）
  name: xkjd27c_flow.order
  # `-` 上调时，若目标级别已有 pin，被顶掉的候选是否沿它自己的
  # 形码串顺延到下一级（继续冲突则继续顺延），而不是回到自然排序。
  displace: true

# 候选提示：非首选候选右侧显示「让它成为首选还需要按的键」
# （声码未输完补声码，输完则给形码）；设为 false 关闭
flow_hint: true

jffh:
  opencc_config: s2t.json
  option_name: jffh

punctuator:
  full_shape:
    ' ' : { commit: '　' }
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '?' : { commit: ？ }
    '/' : { commit: / }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, ＼ ]
    '|' : [ ·, ｜, '§', '¦' ]
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '%' : [ ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
  half_shape:
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '?' : { commit: ？ }
    '/' : { commit: / }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, '\', ＼ ]
    '|' : [ ·, '|', ｜, '§', '¦' ]
    '`' : '`'
    '~' : [ '~', ～ ]
    '!' : { commit: ！ }
    '@' : '@'
    '#' : '#'
    '%' : [ '%', ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕,  ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]

key_binder:
  bindings:
    - {when: always, accept: F6, select: .next }
    - {when: always, accept: F7, toggle: jffh }
    - {when: paging, accept: bracketleft, send: Page_Up }
    - {when: has_menu, accept: bracketright, send: Page_Down }
